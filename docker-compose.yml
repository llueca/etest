name: btc-up-down
# DynamoDB Local for local development, contract tests and e2e.
# Port 8100 avoids clashing with other local DynamoDB instances on 8000.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 30
